/* =====================================================================
   MOTEUR — styles. Ne dépend d'aucun contenu, uniquement de la structure
   des vues (accueil, consulter, réviser, pratiquer, suivi, notion).
   ===================================================================== */
:root{
  --bg:#f7f1e3;
  --bg-card:#fffdf7;
  --bg-raised:#ffffff;
  --ink:#2a2116;
  --ink-soft:#6f6152;
  --ink-faint:#a89985;
  --line:#e6dabf;
  --line-soft:#efe4cd;
  --accent:#b5502f;
  --accent-ink:#fffaf3;
  --accent-soft:#f2ded1;
  --sauge:#5c6b46;
  --sauge-soft:#e3e8d5;
  --ocre:#a97a22;
  --ocre-soft:#f2e4c4;
  --rouge:#a1402f;
  --rouge-soft:#f3ddd4;
  --radius-s:8px;
  --radius-m:14px;
  --radius-l:24px;
  --shadow:0 1px 2px rgba(40,28,15,.06), 0 10px 24px -14px rgba(40,28,15,.35);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1a1610;
    --bg-card:#231e16;
    --bg-raised:#2a241a;
    --ink:#f3e9d6;
    --ink-soft:#c4b59c;
    --ink-faint:#8a7c67;
    --line:#3a3223;
    --line-soft:#2d2819;
    --accent:#e28457;
    --accent-ink:#1a1610;
    --accent-soft:#3c2a20;
    --sauge:#a3b98a;
    --sauge-soft:#2b3323;
    --ocre:#d9ac5c;
    --ocre-soft:#3a2f1b;
    --rouge:#e08e7d;
    --rouge-soft:#3a2620;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0 0 .4em;color:var(--ink);}
p{margin:0 0 .8em;}
p:last-child{margin-bottom:0;}
ul{margin:0 0 .8em;padding-left:1.2em;}
ul:last-child{margin-bottom:0;}
li{margin-bottom:.3em;}
a{color:inherit;}
button{font:inherit;color:inherit;}
input,textarea{font:inherit;color:inherit;}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  position:relative;
}

.topbar{
  position:sticky;top:0;z-index:5;
  background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  border-bottom:1px solid transparent;
}
.topbar.raised{border-bottom-color:var(--line);}
.topbar .brand{font-family:var(--serif);font-weight:700;font-size:1.05rem;letter-spacing:.01em;}
.topbar .brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.72rem;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase;margin-top:1px;}
.back-btn{
  background:none;border:none;padding:6px 8px 6px 2px;margin-left:-6px;
  font-size:.95rem;color:var(--ink-soft);display:flex;align-items:center;gap:2px;cursor:pointer;
}

main{padding:6px 18px 28px;}

/* --- Home --- */
.hero{padding:6px 0 18px;}
.hero h1{font-size:1.6rem;margin-bottom:.15em;}
.hero .sub{color:var(--ink-soft);font-size:.95rem;}

.stat-row{display:flex;gap:10px;margin:16px 0 22px;}
.stat{
  flex:1;background:var(--bg-card);border:1px solid var(--line-soft);border-radius:var(--radius-m);
  padding:12px 14px;text-align:left;
}
.stat .n{font-family:var(--serif);font-size:1.5rem;font-weight:700;line-height:1;display:block;}
.stat .l{font-size:.72rem;color:var(--ink-soft);margin-top:4px;display:block;}

.section-title{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);
  margin:22px 0 10px;
}

.depannage-panel{
  background:var(--rouge-soft);border-radius:var(--radius-l);padding:16px;margin-bottom:6px;
}
.depannage-panel h2{font-size:1rem;color:var(--rouge);margin-bottom:2px;}
.depannage-panel .hint{font-size:.82rem;color:var(--ink-soft);margin-bottom:12px;}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  display:inline-flex;align-items:center;
  background:var(--bg-raised);border:1px solid var(--line);color:var(--ink);
  border-radius:100px;padding:8px 14px;font-size:.85rem;cursor:pointer;text-decoration:none;
  transition:transform .1s ease;
}
.chip:active{transform:scale(.96);}
.chip.on-rouge{border-color:transparent;}

.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cat-card{
  background:var(--bg-card);border:1px solid var(--line-soft);border-radius:var(--radius-m);
  padding:14px;text-align:left;cursor:pointer;text-decoration:none;display:block;color:var(--ink);
}
.cat-card h3{font-size:.98rem;margin-bottom:3px;}
.cat-card p{font-size:.76rem;color:var(--ink-soft);margin-bottom:6px;}
.cat-card .count{font-size:.72rem;color:var(--ink-faint);}

.nav-cards{display:flex;flex-direction:column;gap:10px;}
.nav-card{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--radius-m);
  padding:15px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
}
.nav-card .t{font-family:var(--serif);font-weight:700;font-size:1.02rem;}
.nav-card .d{font-size:.78rem;color:var(--ink-soft);margin-top:2px;}
.nav-card .badge{
  background:var(--accent);color:var(--accent-ink);border-radius:100px;min-width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;padding:0 7px;flex:none;
}
.nav-card .arrow{color:var(--ink-faint);font-size:1.1rem;flex:none;}

/* --- Search / filters --- */
.search-wrap{position:sticky;top:56px;z-index:4;background:var(--bg);padding-bottom:10px;}
.search-input{
  width:100%;border:1px solid var(--line);background:var(--bg-raised);border-radius:100px;
  padding:11px 16px;font-size:.95rem;outline:none;
}
.search-input:focus{border-color:var(--accent);}
.filter-row{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{
  flex:none;background:var(--bg-raised);border:1px solid var(--line);border-radius:100px;
  padding:7px 13px;font-size:.82rem;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
}
.filter-chip.active{background:var(--ink);border-color:var(--ink);color:var(--bg);}

.notion-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.notion-item{
  display:block;text-decoration:none;color:var(--ink);
  background:var(--bg-card);border:1px solid var(--line-soft);border-radius:var(--radius-m);
  padding:13px 15px;
}
.notion-item .tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:600;}
.notion-item h3{font-size:1rem;margin:.15em 0 .2em;}
.notion-item p{font-size:.82rem;color:var(--ink-soft);}
.empty-state{padding:40px 10px;text-align:center;color:var(--ink-faint);font-size:.9rem;}

/* --- Notion detail --- */
.notion-head{padding:8px 0 4px;}
.notion-head .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;}
.notion-head h1{font-size:1.5rem;margin:.2em 0 .25em;}
.notion-head .resume{color:var(--ink-soft);font-size:.95rem;}

.block{margin-top:20px;}
.block h2{font-size:.98rem;}
.prose h4{font-size:.92rem;margin-top:1.1em;color:var(--accent);}
.prose{font-size:.94rem;}
.prose strong{color:var(--ink);}

.vigilance-box{
  background:var(--ocre-soft);border-radius:var(--radius-m);padding:14px 16px;
}
.vigilance-box h2{color:var(--ocre);font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.vigilance-box ul{margin:0;padding-left:1.1em;font-size:.88rem;}

details.fold{border:1px solid var(--line-soft);border-radius:var(--radius-m);overflow:hidden;}
details.fold + details.fold{margin-top:8px;}
details.fold summary{
  padding:12px 15px;cursor:pointer;font-size:.88rem;font-weight:600;list-style:none;
  display:flex;justify-content:space-between;align-items:center;
}
details.fold summary::-webkit-details-marker{display:none;}
details.fold summary::after{content:"+";color:var(--ink-faint);font-size:1.1rem;}
details.fold[open] summary::after{content:"–";}
details.fold .fold-body{padding:0 15px 14px;font-size:.88rem;color:var(--ink-soft);}
details.fold ul{padding-left:1.1em;}

.lien-chips{display:flex;flex-wrap:wrap;gap:8px;}

/* --- Buttons --- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:100px;padding:13px 20px;font-size:.92rem;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--bg-raised);color:var(--ink);width:100%;
  text-decoration:none;
}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-ghost{background:none;border-color:var(--line);}
.btn-row{display:flex;gap:10px;margin-top:16px;}
.btn-row .btn{width:auto;flex:1;}

/* --- Réviser --- */

  background:var(--bg-raised);border-radius:var(--radius-l);box-shadow:var(--shadow);
  padding:24px 20px;margin-top:12px;min-height:280px;display:flex;flex-direction:column;
}
.session-progress{font-size:.72rem;color:var(--ink-faint);margin-bottom:14px;}
.session-card .tag{font-size:.7rem;text-transform:uppercase;color:var(--accent);font-weight:700;letter-spacing:.05em;}
.session-card h2{font-size:1.2rem;margin:.3em 0 .5em;}
.session-question{font-size:1.02rem;color:var(--ink-soft);flex:1;}
.session-answer{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:14px;}
.eval-row{display:flex;gap:8px;margin-top:18px;}

.eval-btn small{display:block;font-weight:400;font-size:.68rem;color:var(--ink-faint);margin-top:2px;}

.dot-acquis{color:var(--sauge);}

.journal-entry{

}

.journal-entry .meta a{color:var(--accent);text-decoration:none;font-weight:600;}

.export-box{
  margin-top:24px;padding-top:18px;border-top:1px solid var(--line);

/* --- Bottom nav --- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:var(--bg-raised);border-top:1px solid var(--line);

  display:flex;justify-content:center;

.tabbar-inner{display:flex;width:100%;max-width:560px;}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  text-decoration:none;color:var(--ink-faint);font-size:.68rem;padding:6px 2px;position:relative;

.tab.active .mark{background:var(--accent);}
.tab .tbadge{
  position:absolute;top:0;right:18%;background:var(--rouge);color:#fff;font-size:.62rem;font-weight:700;
  border-radius:100px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;
}

@media (min-width:600px){
  body{background:linear-gradient(var(--bg),var(--bg));}
}

<script>
(function(){
'use strict';

/* =====================================================================
   CONTENU — CUISINE
   Bloc de données pour la plateforme d'apprentissage.
   Le moteur ne connaît rien de ce fichier : remplace-le par un autre
   sujet (géopolitique, musique, allemand) et l'application fonctionne
   à l'identique.

   SCHÉMA D'UNE NOTION
   {
     id:        string unique
     cat:       'levier' | 'ratio' | 'geste' | 'depannage' | 'trame'
     titre:     string
     resume:    une phrase — ce qui s'affiche en liste
     contenu:   le cours, en texte long
     vigilance: [] points d'attention / erreurs fréquentes
     questions: [] auto-évaluation pour le mode Révision
     variations:[] axes de variation pour le mode Pratique
     lien:      [] ids de notions connexes
   }
   ===================================================================== */

const CONTENU = {
  sujet: "Cuisine",
  sousTitre: "Cuisiner sans recette, en semaine, avec le temps qu'on a",
  categories: [
    { id: 'levier',    nom: 'Leviers',    desc: "Les cinq curseurs qui décident si un plat est bon" },
    { id: 'ratio',     nom: 'Ratios',     desc: "Les proportions à connaître par cœur" },
    { id: 'geste',     nom: 'Gestes',     desc: "Les techniques fondamentales, une par fiche" },
    { id: 'trame',     nom: 'Trames',     desc: "Des canevas de repas, pas des recettes" },
    { id: 'depannage', nom: 'Dépannage',  desc: "Le plat est en cours et quelque chose cloche" }
  ],

  notions: [
/* =====================================================================
   1. LES LEVIERS
   ===================================================================== */

{
  id: 'lev-sel',
  cat: 'levier',
  titre: "Le sel",
  resume: "Il ne sale pas, il révèle. Et le moment où tu le mets compte autant que la quantité.",
  contenu: `Le sel est le seul ingrédient qui rend un aliment plus semblable à lui-même. Une carotte salée a un goût de carotte plus intense, pas un goût de sel. C'est pour ça qu'il est le premier levier : la plupart des plats jugés « fades » ne manquent pas d'épices, ils manquent de sel bien placé.

**Ce qu'il fait réellement**

Trois effets, très différents les uns des autres.

D'abord il amplifie la perception des arômes : nos récepteurs détectent mieux les molécules aromatiques en présence d'ions sodium. Ensuite il supprime l'amertume — c'est pour ça qu'une pincée de sel sur un pamplemousse le rend plus sucré, et pourquoi on sale l'eau des légumes amers. Enfin il agit physiquement sur les aliments : il tire l'eau par osmose, puis, si on lui laisse le temps, il la fait revenir en emportant le sel avec elle. C'est tout le principe de la saumure.

**La question du moment**

C'est ici que se joue la différence entre un cuisinier qui suit une recette et un cuisinier qui sait ce qu'il fait.

Le sel a besoin de temps pour pénétrer. Sur une pièce de viande épaisse, il met des heures à traverser. Sur un légume coupé, quelques minutes. Dans une soupe, il diffuse immédiatement. Donc : plus l'aliment est dense et épais, plus tu sales tôt.

Concrètement, à la maison, en semaine :
- Viande épaisse (poulet entier, rôti, côte) : sale la veille ou le matin, à sec, et laisse au frigo à découvert. C'est la technique la plus rentable de toute la cuisine — trente secondes de travail pour un résultat qu'aucun assaisonnement de dernière minute ne rattrapera.
- Viande fine, escalope, steak : sale juste avant de saisir, ou trois heures avant. Entre les deux, tu es dans la mauvaise fenêtre — le sel a tiré l'eau en surface mais n'est pas encore reparti dedans, et tu obtiens une surface humide qui ne dore pas.
- Légumes : sale en début de cuisson, ils libèrent leur eau et concentrent leur goût.
- Soupe, sauce, braisé : sale par couches, un peu à chaque étape, et corrige à la fin. Jamais tout d'un coup au départ, car ça réduit et ça se concentre.

**Saler par couches**

C'est l'idée la plus importante et la moins appliquée. Chaque composant d'un plat doit être assaisonné pour lui-même. Si tu fais des pâtes à la sauce tomate : l'eau des pâtes est salée, l'oignon est salé quand il sue, la sauce est salée pendant qu'elle réduit. Le résultat n'est pas trois fois trop salé — il est assaisonné en profondeur. À l'inverse, un plat salé uniquement à la fin a un goût de sel posé par-dessus, pas un goût intégré.

**Quel sel pour quoi**

Le gros sel pour tout ce qui est immergé : eau de cuisson, saumure. Il se dissout de toute façon, autant prendre le moins cher.

Le sel fin pour l'assaisonnement en cours de cuisson. Attention : à volume égal, le sel fin est bien plus salé que le gros sel, parce qu'il est plus dense. Une cuillère de gros sel et une cuillère de sel fin n'ont rien à voir. Si tu changes de sel, tu dois réapprendre ta main.

La fleur de sel uniquement à la fin, sur un aliment déjà cuit et déjà assaisonné, pour le croquant et pour les points de salinité qui éclatent en bouche. La mettre en cuisson, c'est jeter de l'argent.

  contenu: `La lactofermentation est la conservation la plus simple qui existe, et elle produit un ingrédient que rien d'autre ne remplace : un acide vivant, complexe, avec de l'umami en prime. Pour quelqu'un qui cherche à cuisiner vite et bien, avoir un bocal de fermenté au frigo est un raccourci permanent.

Les bactéries lactiques présentes naturellement sur les légumes transforment les sucres en acide lactique. Cet acide fait chuter le pH, ce qui élimine tout ce qui pourrait faire pourrir. Le sel gère la transition : il freine les indésirables le temps que les lactiques prennent le contrôle.

2 % du poids total, légumes et eau confondus. Pour 1 kg de chou et 0 eau : 20 g de sel. Pour 700 g de légumes plus 300 ml d'eau : 20 g de sel.

/* ---------- Stockage : window.storage avec repli localStorage ---------- */
const Store = (function(){
  const backend = (typeof window.storage !== 'undefined' && window.storage
    && typeof window.storage.getItem === 'function') ? window.storage : window.localStorage;
  return {
    get(key, fallback){
      try{ const raw = backend.getItem(key); return raw != null ? JSON.parse(raw) : fallback; }
      catch(e){ return fallback; }
    },
    set(key, value){
      try{ backend.setItem(key, JSON.stringify(value)); } catch(e){}
    }
  };
})();

const STATE_KEY = 'trame_state_v1';

function defaultState(){
  return { version: 1, createdAt: new Date().toISOString(), review: {}, practice: {}, journal: [] };
}

let State = Store.get(STATE_KEY, null) || defaultState();
function persist(){ Store.set(STATE_KEY, State); }

/* ---------- Index du contenu ---------- */
const NOTIONS = CONTENU.notions;
const NOTION_BY_ID = {};
NOTIONS.forEach(n => NOTION_BY_ID[n.id] = n);
const CATS = CONTENU.categories;
const CAT_BY_ID = {};
CATS.forEach(c => CAT_BY_ID[c.id] = c);
const REVISABLE = NOTIONS.filter(n => n.questions && n.questions.length);
const PRACTICABLE = NOTIONS.filter(n => n.variations && n.variations.length);

/* ---------- Aides de temps ---------- */
function nowISO(){ return new Date().toISOString(); }
function daysAgo(iso){
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if(d <= 0) return "aujourd'hui";
  if(d === 1) return "hier";
  return `il y a ${d} jours`;
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
}

/* ---------- Répétition espacée (3 niveaux, pas de QCM) ---------- */
function dueNotions(){
  const now = Date.now();
  return REVISABLE.filter(n => {
    const r = State.review[n.id];
    return !r || new Date(r.nextReview).getTime() <= now;
  });
}
function scheduleNext(id, level){
  const r = State.review[id] || { interval: 0, reviewCount: 0, history: [] };
  let interval;
  if(level === 1) interval = 0.4;
  else if(level === 2) interval = r.interval >= 1 ? Math.round(r.interval * 1.8 * 10) / 10 : 1.5;
  else interval = r.interval >= 1 ? Math.round(r.interval * 3.2 * 10) / 10 : 4;
  interval = Math.max(interval, level === 1 ? 0.4 : 1);
  r.interval = interval;
  r.lastLevel = level;
  r.reviewCount = (r.reviewCount || 0) + 1;
  r.nextReview = new Date(Date.now() + interval * 86400000).toISOString();
  r.history = r.history || [];
  r.history.push({ date: nowISO(), level });
  if(r.history.length > 20) r.history.shift();
  State.review[id] = r;
  persist();
}

/* ---------- Pratique : proposer une notion + un axe différent de la dernière fois ---------- */
function pickPracticeNotion(excludeId){
  const pool = PRACTICABLE.filter(n => n.id !== excludeId);
  const neverPracticed = pool.filter(n => !State.practice[n.id]);
  if(neverPracticed.length) return neverPracticed[Math.floor(Math.random() * neverPracticed.length)];
  return pool.slice().sort((a, b) => new Date(State.practice[a.id].lastAt) - new Date(State.practice[b.id].lastAt))[0] || pool[0];
}
function pickVariationIndex(notion){
  const p = State.practice[notion.id];
  const vs = notion.variations;
  if(!p || vs.length <= 1) return 0;
  return (p.lastVariationIndex + 1) % vs.length;
}
function recordPractice(notionId, variationIndex, variationText, q1, q2){
  const p = State.practice[notionId] || { count: 0 };
  p.count = (p.count || 0) + 1;
  p.lastAt = nowISO();
  p.lastVariationIndex = variationIndex;
  p.lastVariationText = variationText;
  State.practice[notionId] = p;
  State.journal.push({
    id: 'j_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    notionId, date: nowISO(), q1, q2
  });
  persist();
}

/* ---------- Progression ---------- */
function progressionData(){
  const acquis = NOTIONS.filter(n => {
    const r = State.review[n.id];
    return r && r.lastLevel === 3 && r.reviewCount >= 2 && r.interval >= 10;
  });
  const traine = NOTIONS.filter(n => {
    const r = State.review[n.id];
    return r && new Date(r.nextReview).getTime() < Date.now();
  });
  const jamaisPratique = PRACTICABLE.filter(n => !State.practice[n.id]);
  return { acquis, traine, jamaisPratique };
}

/* ---------- Export JSON ---------- */
function exportJSON(){
  const payload = { exportedAt: nowISO(), sujet: CONTENU.sujet, state: State };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `trame-${CONTENU.sujet.toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- Formatage léger du texte de contenu (gras + listes) ---------- */
function escapeHtml(s){
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inlineFormat(s){
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function formatContenu(text){
  const blocks = text.trim().split(/\n\n+/);
  let html = '';
  blocks.forEach(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if(lines.length === 1){
      const m = lines[0].match(/^\*\*(.+)\*\*$/);
      if(m){ html += `<h4>${escapeHtml(m[1])}</h4>`; return; }
    }
    let para = [], list = [];
    const flushPara = () => { if(para.length){ html += '<p>' + para.map(inlineFormat).join(' ') + '</p>'; para = []; } };
    const flushList = () => { if(list.length){ html += '<ul>' + list.map(l => `<li>${inlineFormat(l)}</li>`).join('') + '</ul>'; list = []; } };
    lines.forEach(line => {
      if(line.startsWith('- ')){ flushPara(); list.push(line.slice(2).trim()); }
      else { flushList(); para.push(line); }
    });
    flushPara(); flushList();
  });
  return html;
}

      <div class="hero"><h1>Session terminée</h1></div>
      <div class="session-card">
        <div class="session-progress">${st.queue.length} notion${st.queue.length > 1 ? 's' : ''} revue${st.queue.length > 1 ? 's' : ''}</div>
        <div class="eval-row" style="margin-top:4px">
          <div class="eval-btn eval-1">${r[1]}<small>à revoir</small></div>
          <div class="eval-btn eval-2">${r[2]}<small>hésité</small></div>
          <div class="eval-btn eval-3">${r[3]}<small>su</small></div>
        </div>
        <div class="btn-row"><button class="btn btn-primary" data-action="reviser-reset">Retour à l'accueil</button></div>
      </div>
    `, { active: 'reviser' });
  }
  const n = NOTION_BY_ID[st.queue[st.index]];
  return shell(`
    <div class="session-progress">${st.index + 1} / ${st.queue.length}</div>
    <div class="session-card">
      <div>
        <span class="tag">${escapeHtml(catLabel(n.cat))}</span>
        <h2>${escapeHtml(n.titre)}</h2>
        <div class="session-question">${escapeHtml(st.question)}</div>
      </div>
      ${st.revealed ? `
        <div class="session-answer prose">${formatContenu(n.contenu)}</div>
        ${n.vigilance && n.vigilance.length ? `<div class="block vigilance-box"><h2>Points de vigilance</h2><ul>${n.vigilance.map(v => `<li>${escapeHtml(v)}</li>`).join('')}</ul></div>` : ''}
        <div class="eval-row">
          <div class="eval-btn eval-1" data-action="reviser-eval" data-level="1">À revoir<small>revient vite</small></div>
          <div class="eval-btn eval-2" data-action="reviser-eval" data-level="2">Hésité<small>revient bientôt</small></div>
          <div class="eval-btn eval-3" data-action="reviser-eval" data-level="3">Su<small>revient plus tard</small></div>
        </div>
      ` : `
        <div class="btn-row" style="margin-top:auto"><button class="btn btn-primary" data-action="reviser-reveal">Afficher la réponse</button></div>
      `}
    </div>
  `, { active: 'reviser' });
}

function ensurePracticeProposal(){
  const st = ui.pratique;
  if(!st.notionId){
    const n = pickPracticeNotion(st.excludeId || null);
    st.notionId = n.id;
    st.variationIndex = pickVariationIndex(n);
    st.step = 'proposal';
    st.excludeId = null;
  }
}

function viewPratiquer(){
  const st = ui.pratique;
  if(!PRACTICABLE.length){
    return shell(`<div class="empty-state">Aucune notion pratiquable pour l'instant.</div>`, { active: 'pratiquer' });
  }
  if(st.step === 'saved'){
    return shell(`
      <div class="hero"><h1>Noté.</h1><div class="sub">Ça alimente ta progression.</div></div>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="pratique-next">Nouvelle proposition</button>
        <a class="btn btn-ghost" href="#/suivi/journal">Voir le journal</a>
      </div>
    `, { active: 'pratiquer' });
  }
  ensurePracticeProposal();
  const n = NOTION_BY_ID[st.notionId];
  const variation = n.variations[st.variationIndex];
  const prevP = State.practice[n.id];

  if(st.step === 'journal'){
    return shell(`
      <div class="hero"><h1>Pratiquer</h1></div>
      <div class="practice-card">
        <span class="tag">${escapeHtml(catLabel(n.cat))}</span>
        <h2>${escapeHtml(n.titre)}</h2>
        <div class="variation-box"><div class="label">Ce que tu as changé</div><div class="txt">${escapeHtml(variation)}</div></div>
      </div>
      <div class="journal-q">
        <label>Qu'est-ce qui a bien marché cette fois ?</label>
        <textarea id="j-q1" placeholder="…"></textarea>
      </div>
      <div class="journal-q">
        <label>Qu'est-ce que tu changes la prochaine fois ?</label>
        <textarea id="j-q2" placeholder="…"></textarea>
      </div>
      <div class="btn-row"><button class="btn btn-primary" data-action="pratique-save">Enregistrer</button></div>
    `, { active: 'pratiquer' });
  }

  return shell(`
    <div class="hero"><h1>Pratiquer</h1><div class="sub">Une notion, un axe à changer par rapport à la dernière fois.</div></div>
    <div class="practice-card">
      <span class="tag">${escapeHtml(catLabel(n.cat))}</span>
      <h2>${escapeHtml(n.titre)}</h2>
      <p>${escapeHtml(n.resume)}</p>
      <div class="variation-box">
        <div class="label">Aujourd'hui, change</div>
        <div class="txt">${escapeHtml(variation)}</div>
      </div>
      ${prevP && prevP.lastVariationText ? `<div class="variation-last">Dernière fois (${daysAgo(prevP.lastAt)}) : ${escapeHtml(prevP.lastVariationText)}</div>` : ''}
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" data-action="pratique-shuffle">Autre chose</button>
      <a class="btn btn-ghost" href="#/notion/${n.id}">Voir la fiche</a>
    </div>
    <div class="btn-row"><button class="btn btn-primary" data-action="pratique-done">J'ai pratiqué</button></div>
  `, { active: 'pratiquer' });
}

function viewSuivi(tab){
  tab = tab || 'progression';
  const prog = progressionData();
  const group = (title, dotClass, list, emptyMsg) => `
    <details class="progress-group">
      <summary><span><span class="${dotClass}">●</span> ${title}</span><span class="count">${list.length}</span></summary>
      <div class="glist">${list.length ? list.map(n => `<a class="grow-link" href="#/notion/${n.id}">${escapeHtml(n.titre)}</a>`).join('') : `<div class="grow-link" style="color:var(--ink-faint)">${emptyMsg}</div>`}</div>
    </details>`;

  const progressionHtml = `
    ${group('Acquis', 'dot-acquis', prog.acquis, "Rien pour l'instant.")}
    ${group('Ça traîne', 'dot-traine', prog.traine, "Rien en retard, bien joué.")}
    ${group('Jamais pratiqué', 'dot-jamais', prog.jamaisPratique, "Tout a été pratiqué au moins une fois.")}
    <div class="export-box">
      <p>Exporte toutes tes données (révisions, pratiques, journal) en JSON. Rien ne sort de l'appareil autrement.</p>
      <button class="btn btn-ghost" data-action="export">Exporter mes données</button>
    </div>
  `;

  const journalEntries = State.journal.slice().reverse();
  const journalHtml = journalEntries.length ? journalEntries.map(e => {
    const n = NOTION_BY_ID[e.notionId];
    return `
      <div class="journal-entry">
        <div class="meta"><a href="#/notion/${e.notionId}">${n ? escapeHtml(n.titre) : '—'}</a> · ${fmtDate(e.date)}</div>
        <div class="qa"><div class="q">Ce qui a marché</div>${escapeHtml(e.q1 || '—')}</div>
        <div class="qa"><div class="q">La prochaine fois</div>${escapeHtml(e.q2 || '—')}</div>
      </div>`;
  }).join('') : `<div class="empty-state">Ton journal se remplit après chaque pratique.</div>`;

  return shell(`
    <div class="hero"><h1>Suivi</h1></div>
    <div class="seg">
      <div class="seg-btn${tab === 'progression' ? ' active' : ''}" data-action="suivi-tab" data-tab="progression">Progression</div>
      <div class="seg-btn${tab === 'journal' ? ' active' : ''}" data-action="suivi-tab" data-tab="journal">Journal</div>
    </div>
    ${tab === 'progression' ? progressionHtml : journalHtml}
  `, { active: 'suivi' });
}

/* =====================================================================
   ROUTEUR
   ===================================================================== */

function parseRoute(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(!parts.length || parts[0] === 'home') return { name: 'home' };
  if(parts[0] === 'consulter') return { name: 'consulter', cat: parts[1] || 'all' };
  if(parts[0] === 'notion') return { name: 'notion', id: parts[1] };
  if(parts[0] === 'reviser') return { name: 'reviser' };
  if(parts[0] === 'pratiquer') return { name: 'pratiquer' };
  if(parts[0] === 'suivi') return { name: 'suivi', tab: parts[1] || 'progression' };
  return { name: 'home' };
}

function currentViewHtml(){
  const r = parseRoute();
  switch(r.name){
    case 'consulter': return viewConsulter(r.cat);
    case 'notion': return viewNotion(r.id);
    case 'reviser': return viewReviser();
    case 'pratiquer': return viewPratiquer();
    case 'suivi': return viewSuivi(r.tab);
    default: return viewHome();
  }
}

const appEl = document.getElementById('app');

function rerender(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;
  appEl.innerHTML = currentViewHtml();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart != null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

window.addEventListener('hashchange', () => { window.scrollTo(0, 0); rerender(); });

appEl.addEventListener('click', function(e){
  if(e.target.closest('[data-action="back"]')){ history.back(); return; }

  const catChip = e.target.closest('[data-action="consulter-cat"]');
  if(catChip){
    const cat = catChip.getAttribute('data-cat');
    location.hash = cat === 'all' ? '#/consulter' : '#/consulter/' + cat;
    return;
  }

  if(e.target.closest('[data-action="reviser-start"]')){
    const q = shuffle(dueNotions().map(n => n.id));
    ui.reviser = { queue: q, index: 0, revealed: false, question: pickQuestion(NOTION_BY_ID[q[0]]), results: { 1: 0, 2: 0, 3: 0 } };
    rerender();
    return;
  }
  if(e.target.closest('[data-action="reviser-reveal"]')){
    ui.reviser.revealed = true;
    rerender();
    return;
  }
  const revEval = e.target.closest('[data-action="reviser-eval"]');
  if(revEval){
    const level = parseInt(revEval.getAttribute('data-level'), 10);
    const st = ui.reviser;
    const id = st.queue[st.index];
    scheduleNext(id, level);
    st.results[level] = (st.results[level] || 0) + 1;
    st.index += 1;
    st.revealed = false;
    if(st.index < st.queue.length) st.question = pickQuestion(NOTION_BY_ID[st.queue[st.index]]);
    rerender();
    return;
  }
  if(e.target.closest('[data-action="reviser-reset"]')){
    ui.reviser = { queue: null, index: 0, revealed: false, question: '', results: { 1: 0, 2: 0, 3: 0 } };
    location.hash = '#/home';
    return;
  }

  if(e.target.closest('[data-action="pratique-shuffle"]')){
    ui.pratique.excludeId = ui.pratique.notionId;
    ui.pratique.notionId = null;
    rerender();
    return;
  }
  if(e.target.closest('[data-action="pratique-done"]')){
    ui.pratique.step = 'journal';
    rerender();
    return;
  }
  if(e.target.closest('[data-action="pratique-save"]')){
    const q1 = (document.getElementById('j-q1') || {}).value || '';
    const q2 = (document.getElementById('j-q2') || {}).value || '';
    const n = NOTION_BY_ID[ui.pratique.notionId];
    recordPractice(n.id, ui.pratique.variationIndex, n.variations[ui.pratique.variationIndex], q1.trim(), q2.trim());
    ui.pratique.step = 'saved';
    rerender();
    return;
  }
  if(e.target.closest('[data-action="pratique-next"]')){
    ui.pratique.notionId = null;
    rerender();
    return;
  }

  const suiviTab = e.target.closest('[data-action="suivi-tab"]');
  if(suiviTab){
    location.hash = '#/suivi/' + suiviTab.getAttribute('data-tab');
    return;
  }

  if(e.target.closest('[data-action="export"]')){ exportJSON(); return; }
});

appEl.addEventListener('input', function(e){
  if(e.target.id === 'q-search'){
    ui.consulterQuery = e.target.value;
    rerender();
  }
});

rerender();

})();
</script>
